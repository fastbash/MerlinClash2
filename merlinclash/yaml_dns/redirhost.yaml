dns:
  enable: true
  ipv6: false
  listen: :23453
  enhanced-mode: redir-host
  respect-rules: true
  nameserver:
    - 223.5.5.5
  fallback:
    - https://8.8.8.8/dns-query
  fallback-filter:
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
      - 127.0.0.1/32
  direct-nameserver:
    - 223.5.5.5
  proxy-server-nameserver:
    - 223.5.5.5
